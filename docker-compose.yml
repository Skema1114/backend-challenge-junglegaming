services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wagering_secret}
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wagering} -d ${DB_NAME:-wagering}"]
      interval: 3s
      timeout: 3s
      retries: 15

  localstack:
    image: localstack/localstack:3.8
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1"]
      interval: 4s
      timeout: 4s
      retries: 20

volumes:
  postgres_data:
